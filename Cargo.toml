[package]
name = "ssx-valuation"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Mirai Trade's event-driven valuation engine for football club pricing - the pricing/vAMM math, open-sourced for verification."
repository = "https://github.com/dolphlabs/ssx-valuation"

[dependencies]
rust_decimal = { version = "1.34", features = ["maths"] }
rust_decimal_macros = "1.3.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rand = "0.8"
rand_distr = "0.4"
tracing = "0.1"
tokio = { version = "1.0", features = ["full"] }
dashmap = "6.0"
